<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelbookLviv - Логін/Реєстрація</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./login/style.css">
</head>
<body>
<header id="navbar"></header>
<script type="module" src="navbar.js"></script>


<main>
    <div class="form-container">
        <div class="tabs">
            <button id="login-tab" class="active">Логін</button>
            <button id="register-tab">Реєстрація</button>
        </div>

        <form id="login-form" class="form active">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" placeholder="Введіть ваш email" required>

            <label for="login-password">Пароль:</label>
            <input type="password" id="login-password" placeholder="Введіть ваш пароль" required>

            <button type="submit" class="btn-primary">Увійти</button>
        </form>

        <form id="register-form" class="form" style="display:none;">
            <label for="reg-name">Ім’я:</label>
            <input type="text" id="reg-name" placeholder="Введіть ваше ім’я" required>

            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" placeholder="Введіть ваш email" required>

            <label for="reg-password">Пароль:</label>
            <input type="password" id="reg-password" placeholder="Введіть пароль" required>

            <button type="submit" class="btn-primary">Зареєструватись</button>
        </form>

        <div id="status" style="margin-top:15px; text-align:center; font-weight:bold;"></div>
    </div>

</main>

<footer>
    <p>2025 HotelBookLviv. Дані клієнтів захищені</p>
</footer>

<script  type="module" src="login/script.js"></script>
</body>
</html>
